org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 passou a aplicar o Kotlin sozinho ("built-in Kotlin"). Aqui ele fica
# desligado de proposito: o modulo :core:protocol e Kotlin/JVM puro e ja precisa
# do plugin org.jetbrains.kotlin.jvm, entao manter os plugins explicitos deixa a
# versao do Kotlin igual nos tres modulos, num lugar so (libs.versions.toml).
android.builtInKotlin=false

kotlin.code.style=official
