org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# O Kotlin embutido da AGP 9 fica LIGADO (padrao). Tentar desliga-lo para
# aplicar o org.jetbrains.kotlin.android a mao quebra o sync: o plugin avulso
# ainda faz cast do android {} para BaseExtension, interface que a AGP 9 nao
# expoe mais. Os modulos Android nao aplicam plugin de Kotlin nenhum; so o
# :core:protocol, que e Kotlin/JVM puro, usa o org.jetbrains.kotlin.jvm.

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
